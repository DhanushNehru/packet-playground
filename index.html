<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Learn networking by playing with packets, DNS, TCP, subnetting and the web. Free interactive browser simulations, no signup."><meta name="theme-color" content="#09060e"><title>Packet Playground | Learn networking by doing</title>
<style>
:root{color-scheme:dark;--bg:#09060e;--panel:#15101f;--ink:#f5f1ff;--muted:#b4a9c9;--line:#ffffff23;--accent:#bda3ff;--wash:#ffffff09;--btn:#f5f1ff;--btnink:#150d22;--shadow:#4421b0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}body.light{color-scheme:light;--bg:#f4f0fc;--panel:#fff;--ink:#201532;--muted:#665774;--line:#3120432b;--accent:#6840bd;--wash:#5c309a08;--btn:#241439;--btnink:#fff;--shadow:#d4c1ff}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--wash);border-radius:999px;padding:11px 17px;min-height:44px;font-weight:550}button:hover{background:var(--line)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--btn);color:var(--btnink);border-color:transparent}button[aria-pressed=true],.chip.active{border-color:var(--accent);color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}main:focus{outline:none}.skip{position:absolute;top:-100px;left:20px;z-index:10;background:var(--btn);color:var(--btnink);padding:12px}.skip:focus{top:10px}.shell{max-width:1440px;margin:auto;padding:0 34px}header{display:flex;gap:24px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:650;letter-spacing:-.6px;font-size:21px;text-decoration:none}.brand span{color:var(--accent);font-size:28px;vertical-align:-2px;margin-right:8px}nav{display:flex;gap:25px;margin-left:25px}nav a{color:var(--muted);text-decoration:none;font-size:14px}.prefs{display:flex;gap:8px;margin-left:auto}.prefs button{font-size:12px;padding:8px 13px}main{padding:40px 0 30px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(34px,4vw,55px);line-height:1.08;letter-spacing:-2.2px;font-weight:500;margin-bottom:14px}h2{font-size:25px;line-height:1.2;letter-spacing:-.7px;font-weight:550}h3{font-size:17px;margin-bottom:8px}p{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:14px}.subtle{color:var(--muted);font-size:13px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:30px}.intro p{max-width:570px;margin-bottom:0}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:12px;color:var(--muted)}.dashboard{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.7fr) minmax(0,.8fr);gap:26px;align-items:start}.card{padding:26px;border:1px solid var(--line);border-radius:28px;background:var(--wash);min-width:0}.hero{background:radial-gradient(ellipse at 100% 105%,#a285ff 0%,#4b25b5 35%,#10091c 78%);color:#f8f5ff;padding:30px;border-radius:32px;overflow:hidden;min-height:485px;border:1px solid #b795ff44}.hero p,.hero .subtle{color:#e2d8fb}.hero .eyebrow{color:#e0d3ff}.hero h2{font-size:32px;letter-spacing:-1px;margin-top:5px}.hero .primary{background:#f5efff;color:#21122e}.hero .big{font-size:80px;font-weight:350;letter-spacing:-5px;line-height:1}.hero .metrics{display:flex;gap:20px;align-items:center;margin:28px 0 22px}.meter{height:26px;display:flex;gap:5px;align-items:center;margin-bottom:15px}.meter i{height:100%;flex:1;border-radius:3px;background:#ffffff33}.meter i.done{background:#eee3ff}.orbit{width:100%;height:auto;display:block;overflow:visible}.orbit .float{animation:float 5s ease-in-out infinite}.orbit .float:nth-of-type(2n){animation-delay:-2s}@keyframes float{50%{transform:translateY(-4px)}}.paths{stroke:#ffffff44;stroke-width:1.4;fill:none;stroke-dasharray:3 6}.module-list{padding:20px 0}.module-list h2{margin-bottom:8px}.module-list>p{font-size:14px}.module-link{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;border:0;border-radius:0;background:transparent;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px;color:var(--muted)}.module-link strong{font-weight:500}.module-link:hover,.module-link[aria-current=true]{color:var(--ink)}.module-link .done{color:var(--accent)}.how{display:flex;gap:14px;margin:22px 0}.round{width:28px;height:28px;display:grid;place-items:center;border-radius:99px;background:var(--line);flex:none;font-size:12px}.how p{font-size:14px;margin:2px 0 0}.how strong{font-weight:550;color:var(--ink)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.lab-head{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:26px}.lab-head p{max-width:650px;margin-bottom:0}.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.8fr);gap:24px;align-items:start}.lab-canvas{background:radial-gradient(ellipse at 70% 100%,color-mix(in srgb,var(--shadow) 70%,transparent),transparent 70%),var(--panel);padding:26px;border-radius:30px;border:1px solid var(--line)}.diagram{width:100%;min-height:240px;display:block}.diagram .node{fill:var(--panel);stroke:var(--line);stroke-width:2}.diagram .node.on{fill:#754ae4;stroke:#cbb5ff}.diagram text{fill:var(--ink);font-family:inherit;font-size:13px}.diagram .ontext{fill:#fff}.diagram .wire{stroke:var(--line);stroke-width:2;fill:none}.diagram .route{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:7 5}.packet{fill:#f2eaff;stroke:#6c40bd;stroke-width:2;transition:cx .55s ease,cy .55s ease;filter:drop-shadow(0 0 7px #c6a5ff)}.controls{border-top:1px solid var(--line);padding-top:18px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.speed{display:flex;gap:8px;align-items:center;margin-left:auto;font-size:12px;color:var(--muted)}select,input[type=text]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}select{max-width:100%}input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}.experiments{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:22px}.experiments label{display:block;font-size:13px;color:var(--muted);margin-bottom:9px}.hint{font-size:13px;color:var(--muted);margin:10px 0 0}.explain{padding:24px;border:1px solid var(--line);border-radius:25px;background:var(--wash)}.explain h2{font-size:22px}.explain p{font-size:14px;line-height:1.7}.log{border-top:1px solid var(--line);padding:17px 0 0;margin-top:20px}.log ol{margin:0;padding-left:22px;font-size:12px;color:var(--muted)}.log li{padding:7px 0;overflow-wrap:anywhere}.log li:last-child{color:var(--accent)}.inspector{margin-top:18px;padding:18px;background:var(--wash);border-radius:18px;border:1px solid var(--line)}.inspector p{font-size:13px;margin-bottom:0}.inspect-controls{gap:6px;margin-top:16px}.inspect-controls button{padding:7px 12px;font-size:12px;min-height:38px}.lesson-body{display:grid;grid-template-columns:1.25fr 1fr;gap:25px;margin-top:25px}.lesson-body p{font-size:14px;line-height:1.75}.quiz{background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:26px}.quiz h3{font-size:18px;margin-bottom:17px}.quiz-options{display:grid;gap:10px}.quiz-options button{text-align:left;border-radius:14px;font-size:14px}.feedback{min-height:30px;margin:15px 0 0;font-size:14px}.feedback.correct{color:var(--accent)}.source{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.8}.source a{margin-right:14px}.warning{padding:15px;border-radius:15px;background:var(--wash);border:1px solid var(--line);font-size:13px;margin-top:20px;color:var(--muted)}.subnet-results{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.stat{background:var(--wash);border-radius:15px;padding:16px;overflow-wrap:anywhere}.stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.stat strong{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}.bit-grid{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;margin:20px 0}.bit-grid i{height:24px;background:var(--line);border-radius:3px}.bit-grid i.network{background:var(--accent)}.layer-stack{display:grid;gap:10px;margin:25px auto;max-width:480px}.layer-stack button{border-radius:13px;width:100%;text-align:left;display:flex;justify-content:space-between}.layer-stack button[aria-pressed=true]{background:#7342da;color:#fff}.callout{border-left:2px solid var(--accent);padding-left:16px;margin:18px 0}footer{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-top:1px solid var(--line);padding:24px 0 35px;font-size:12px;color:var(--muted)}footer .row{gap:20px}.hidden,[hidden]{display:none!important}.empty{padding:20px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}.progress-list{display:grid;gap:12px;max-width:800px;margin-top:25px}.progress-item{display:flex;gap:20px;justify-content:space-between;padding:20px;border:1px solid var(--line);border-radius:18px}body.still *,body.still *:before,body.still *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:1100px){.dashboard{grid-template-columns:1.1fr 1fr}.dashboard>.card{grid-column:1/-1}.workspace{grid-template-columns:1.4fr 1fr}.hero h2{font-size:28px}}@media(max-width:760px){.shell{padding:0 20px}header{gap:15px;padding:18px 0}.brand{font-size:18px}.brand span{font-size:25px}nav{order:3;width:100%;margin:0;justify-content:space-between;gap:15px}.prefs{gap:5px}.prefs button{font-size:11px;padding:7px 9px}.prefs .motion-word{display:none}main{padding-top:30px}h1{letter-spacing:-1.5px}.intro,.lab-head{display:block}.intro>.pill{margin-top:20px}.lab-head>.pill{margin-top:15px}.dashboard,.workspace,.lesson-body{display:block}.dashboard>*,.workspace>*{margin-bottom:20px}.hero{padding:25px;min-height:auto}.hero h2{font-size:30px}.hero .big{font-size:72px}.module-list{padding:15px 5px}.card{padding:23px}.lab-canvas{padding:18px}.diagram{min-height:210px}.speed{margin-left:0;width:100%;margin-top:7px}.quiz{margin-top:20px;padding:23px}.lab-head h1{font-size:35px}.experiments{padding:18px}.bit-grid{gap:2px}.bit-grid i{height:20px}.subnet-results{gap:8px}.stat{padding:13px}.stat strong{font-size:14px}.progress-item{padding:15px}.intro p{font-size:14px}footer{align-items:start}.footer-note{max-width:280px}}@media(max-width:380px){.shell{padding:0 14px}.brand{font-size:16px}.brand span{margin-right:3px}.prefs button{padding:6px 8px}.controls button{padding:10px 13px}.diagram text{font-size:12px}.quiz{padding:20px}.hero{padding:22px}}

<body><a class="skip" href="#main">Skip to content</a><div class="shell"><header><a class="brand" href="#home"><span aria-hidden="true">◈</span>Packet Playground</a><nav aria-label="Main navigation"><a href="#home">Learn</a><a href="#packet">Playground</a><a href="#progress">Your progress</a></nav><div class="prefs"><button id="motion" aria-pressed="false" title="Reduce visual motion">Motion <span class="motion-word">on</span></button><button id="theme" aria-label="Switch to light theme">Light ◐</button></div></header><main id="main" tabindex="-1"></main><footer><div class="footer-note">Free to explore. No signup. No live traffic capture.</div><div class="row"><a href="https://github.com/DhanushNehru/packet-playground" target="_blank" rel="noopener noreferrer">Contribute ↗</a><button id="clear" title="Clear only Packet Playground progress on this device">Reset progress</button></div></footer></div><noscript><p style="padding:30px">The interactive labs need JavaScript. No account or paid service is required.</p></noscript>
<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
document.querySelector('.skip').onclick=event=>{event.preventDefault();main.focus();main.scrollIntoView({block:'start'})};
const STORE='packet-playground-v1';
let saved={completed:[],theme:'dark',motion:false};let storageOK=true;
try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&typeof v==='object'){saved.completed=Array.isArray(v.completed)?v.completed.filter(x=>['packet','layers','subnet','dns','transport','web'].includes(x)):[];saved.theme=v.theme==='light'?'light':'dark';saved.motion=!!v.motion}}catch(e){storageOK=false}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){storageOK=false}}
const lessons=[
{id:'packet',title:'Packet journey',tag:'Start with the basics',desc:'Follow a packet from your laptop, through a switch and router, to a server.',learn:'A packet is a small unit of data sent across a network. A switch forwards Ethernet frames inside a local network using MAC addresses. A router forwards IP packets between networks. Real internet paths may cross many routers; this small path is an illustration.',question:'Which device forwards IP packets between different networks?',options:['A network switch','A router','A DNS cache'],answer:1,why:'Routers forward IP packets between networks. Switches generally forward frames inside the local network.',source:'https://developer.mozilla.org/en-US/docs/Learn_web_development/Howto/Web_mechanics/How_does_the_Internet_work',sourceName:'MDN: How the Internet works'},
{id:'layers',title:'Layers & headers',tag:'Look inside the envelope',desc:'Explore a four-layer TCP/IP teaching model and watch data gain headers.',learn:'Each layer has a job. An application creates a message. The transport layer adds information such as ports. The internet layer adds IP addresses. A link layer wraps the packet for a local connection. On receipt, the destination removes each wrapper. This four-layer TCP/IP model is a learning aid, not the seven-layer OSI model.',question:'What identifies the destination application in a TCP segment?',options:['The destination port','The screen resolution','The DNS TTL'],answer:0,why:'The destination port helps deliver data to the right application endpoint, while IP addresses identify network endpoints.',source:'https://www.rfc-editor.org/rfc/rfc1122',sourceName:'RFC 1122: Internet host layers'},
{id:'subnet',title:'IP & subnetting',tag:'Make the boundary visible',desc:'Move the CIDR boundary and see how it changes a conventional IPv4 subnet.',learn:'An IPv4 address contains 32 bits. A /24 prefix uses the first 24 bits as the network portion and leaves 8 host bits. For conventional subnets, the first address is the network address and the last is the broadcast address. This explorer limits prefixes to /16 through /30. /31 point-to-point links and /32 host routes need different handling and are outside this MVP.',question:'How many total IPv4 addresses are in a /26 block?',options:['26','64','256'],answer:1,why:'32 - 26 = 6 host bits, so 2^6 = 64 total addresses. A conventional /26 has 62 usable host addresses.',source:'https://www.rfc-editor.org/rfc/rfc4632',sourceName:'RFC 4632: CIDR'},
{id:'dns',title:'DNS, step by step',tag:'Follow the question',desc:'Trace a simplified uncached DNS lookup, or change to a cache hit.',learn:'A recursive resolver finds DNS answers on behalf of a client. With no relevant cached referrals or answer, it can ask a root server, a top-level-domain server and an authoritative server. A root referral does not contain the website itself. Real lookups may use cached referrals, CNAMEs, multiple addresses and other steps omitted here.',question:'A valid answer is already cached. Must the resolver query the root server again?',options:['Yes, for every request','No, it can return the cached answer'],answer:1,why:'A cached answer can be reused while it is valid. A cache miss may require more queries; a root query is not required for every lookup.',source:'https://www.cloudflare.com/learning/dns/what-is-dns/',sourceName:'Cloudflare: How DNS works'},
{id:'transport',title:'TCP vs UDP',tag:'Reliability is a choice',desc:'Drop one sample data packet and compare TCP retransmission with UDP delivery.',learn:'TCP provides a reliable, ordered byte stream. It uses acknowledgements and retransmissions to recover from loss while the connection remains viable. UDP sends independent datagrams without built-in delivery or ordering guarantees. Applications using UDP can add their own recovery. The loss switch below deliberately drops one sample data packet; it is not a measured loss percentage or a full network emulator.',question:'A UDP datagram is lost. Does UDP itself automatically retransmit it?',options:['Yes, always','No, the application must handle recovery if needed'],answer:1,why:'UDP does not supply automatic retransmission. Applications can implement their own reliability, as protocols such as QUIC do.',source:'https://www.rfc-editor.org/rfc/rfc768',sourceName:'RFC 768: UDP',extra:'https://www.rfc-editor.org/rfc/rfc9293',extraName:'RFC 9293: TCP'},
{id:'web',title:'The web request',tag:'Connect the ideas',desc:'Walk through DNS, TCP, TLS and an HTTPS request in one simplified example.',learn:'This example uses a new HTTPS connection over TCP: DNS finds an address, TCP connects the endpoints, TLS establishes an encrypted channel and HTTP requests a resource. It is not the only web connection pattern. HTTP/3 uses QUIC over UDP, cached DNS can skip a lookup, and connection reuse can skip a new handshake. The animation deliberately separates these ideas for learning.',question:'Does every HTTPS connection use TCP?',options:['Yes','No, HTTP/3 uses QUIC over UDP'],answer:1,why:'HTTPS is HTTP secured with TLS. HTTP/1.1 and HTTP/2 commonly use TCP, while HTTP/3 uses QUIC over UDP.',source:'https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview',sourceName:'MDN: HTTP overview',extra:'https://www.rfc-editor.org/rfc/rfc9114',extraName:'RFC 9114: HTTP/3'}];
let animationEpoch=0;
const state={id:'home',step:0,timer:null,speed:1,cache:false,protocol:'TCP',drop:false,prefix:24,ip:'192.168.1.42',layer:0};
function stop(){if(state.timer){clearInterval(state.timer);state.timer=null}const b=$('#play');if(b)b.textContent='Play'}
function prefs(){document.body.classList.toggle('light',saved.theme==='light');document.body.classList.toggle('still',saved.motion);$('#theme').textContent=saved.theme==='dark'?'Light ◐':'Dark ◑';$('#theme').setAttribute('aria-label',saved.theme==='dark'?'Switch to light theme':'Switch to dark theme');$('#motion').setAttribute('aria-pressed',String(saved.motion));$('#motion').innerHTML='Motion <span class="motion-word">'+(saved.motion?'off':'on')+'</span>'}
$('#theme').onclick=()=>{saved.theme=saved.theme==='dark'?'light':'dark';persist();prefs()};$('#motion').onclick=()=>{saved.motion=!saved.motion;stop();persist();prefs()};$('#clear').onclick=()=>{if(!confirm('Clear your completed lessons on this device? Theme and motion settings will stay.'))return;saved.completed=[];persist();route(false)};prefs();
function e(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function orbit(){return `<svg class="orbit" viewBox="0 0 500 230" aria-label="Illustrative network of laptop, router, DNS and server" role="img"><defs>${[['violet','#d0b3ff','#6840ed'],['lime','#e8ffb3','#79ae29'],['blue','#b2deff','#3f54e8'],['coral','#ffd0a3','#ee5268']].map(([id,a,b])=>`<radialGradient id="${id}"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`).join('')}</defs><path class="paths" d="M80 150 L250 120 L410 55 M250 120 L420 180"/>${[[80,150,30,'Laptop','blue'],[250,120,55,'Router','violet'],[410,55,27,'DNS','lime'],[420,180,37,'Server','coral']].map(([x,y,r,t,c])=>`<g class="float"><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${c})"/><text x="${x}" y="${y+5}" fill="#170c2e" font-size="${r>40?19:13}" text-anchor="middle" font-weight="650">${t}</text></g>`).join('')}<circle cx="320" cy="91" r="7" fill="#f5edff"/><text x="314" y="70" fill="#eaddff" font-size="12">Query</text></svg>`}
function moduleLinks(){return lessons.map((l,i)=>`<a class="module-link" href="#${l.id}"><strong><span class="subtle">0${i+1}</span> &nbsp;${l.title}</strong><span class="${saved.completed.includes(l.id)?'done':''}">${saved.completed.includes(l.id)?'✓':'↗'}</span></a>`).join('')}
function home(){const n=saved.completed.length;main.innerHTML=`<section class="intro"><div><div class="eyebrow">Free networking labs</div><h1>Make the invisible visible.</h1><p>Change a setting. Follow a packet. Find out why it works. Six hands-on lessons, built for curious beginners.</p></div><span class="pill">No signup. Learn at your pace.</span></section><div class="dashboard"><section class="hero"><div class="eyebrow">Your next discovery</div>${orbit()}<h2>Every packet has a story.</h2><p>Start with one journey. Keep exploring.</p><div class="metrics"><div class="big">${n.toString().padStart(2,'0')}</div><div class="subtle">of 06 lessons<br>completed on this device</div></div><div class="meter" aria-label="${n} of 6 lessons complete">${Array.from({length:24},(_,i)=>`<i class="${i<n*4?'done':''}"></i>`).join('')}</div><a href="#${lessons.find(l=>!saved.completed.includes(l.id))?.id||'packet'}" class="module-link" style="color:#fff;border-color:#ffffff40"><strong>${n===6?'Explore again':'Start learning'}</strong><span>↗</span></a></section><section class="module-list"><h2>Your playground</h2><p>One idea at a time. All lessons unlocked.</p>${moduleLinks()}<p class="subtle" style="margin-top:22px">Progress is stored only in this browser.</p></section><section class="card"><div class="eyebrow">Learn by changing things</div><h2>Not another wall of text.</h2>${[['1','Predict','Make a guess before you run it.'],['2','Explore','Pause, step, inspect and change a condition.'],['3','Explain','Check your understanding with feedback.']].map(([n,t,d])=>`<div class="how"><div class="round">${n}</div><p><strong>${t}</strong><br>${d}</p></div>`).join('')}<div class="warning">These are simplified browser simulations, not real traffic capture or certification training.</div><a class="module-link" href="#dns"><strong>Try the DNS explorer</strong><span>↗</span></a></section></div>${!storageOK?'<p class="warning">Browser storage is unavailable. You can use every lab, but progress may not persist.</p>':''}`}
function progress(){main.innerHTML=`<div class="eyebrow">Your progress</div><h1>Small steps. Clearer ideas.</h1><p>${saved.completed.length} of 6 lessons completed. A lesson counts when you answer its check correctly. Nothing is sent to a server.</p><div class="progress-list">${lessons.map(l=>`<a class="progress-item" href="#${l.id}"><span>${l.title}</span><span>${saved.completed.includes(l.id)?'Completed ✓':'Try the lesson ↗'}</span></a>`).join('')}</div>${!storageOK?'<p class="warning">Storage is unavailable. Progress is kept for this session only.</p>':''}`}
function steps(){switch(state.id){case'packet':return [
['Ready to send','The laptop creates data for a server on a different network.',0],['Across the LAN','An Ethernet frame carries the packet to the switch. The switch forwards it toward the gateway.',1],['Between networks','The router uses the destination IP address to choose the next hop. Real paths can include many routers.',2],['Delivered to the server','The server receives the data. The local link header can change at each hop, while IP routing carries the packet onward.',3]];
case'dns':return state.cache?[['Ask the resolver','The browser asks for example.com in this simplified lookup.',0],['A cached answer','The resolver has a valid cached answer. No root or TLD query is needed here.',1],['Answer returned','The resolver returns the cached address. Cache lifetimes are governed by TTL.',0]]:[['Ask the resolver','The client asks its recursive resolver for example.com.',0],['No cached answer','Assume neither the answer nor useful referrals are cached in this example.',1],['Ask a root server','The root refers the resolver to the .com nameservers.',2],['Ask the .com TLD','The TLD server refers the resolver to the authoritative nameservers for example.com.',3],['Ask the authoritative server','The authoritative server returns the requested address record in this simplified example.',4],['Return and cache','The resolver returns the answer to the client and caches it according to its TTL.',0]];
case'transport':if(state.protocol==='UDP')return [['Ready','UDP does not need a TCP-style connection handshake.',0],['Datagram sent','The application sends a UDP datagram to the receiver.',1],state.drop?['Datagram lost','The sample datagram is dropped. UDP itself sends no acknowledgement or retransmission.',2]:['Datagram delivered','This sample datagram reaches the receiver. Delivery is not guaranteed in general.',3],['Application decides','If reliability is needed, the application or a protocol built over UDP must provide it.',state.drop?2:3]];return [['SYN','The client sends SYN to begin a TCP connection.',0],['SYN-ACK','The server acknowledges the SYN and sends its own SYN.',3],['ACK','The client acknowledges. The connection is established.',0],['Send data','A sample data segment travels to the receiver.',1],state.drop?['Data lost','This sample data segment is dropped before reaching the receiver.',2]:['Data acknowledged','The receiver acknowledges the delivered bytes.',3],state.drop?['Retransmit','After loss detection, TCP retransmits the missing data. Timing here is illustrative, not a real TCP timer.',1]:['Ordered stream','TCP presents received data to the application as an ordered byte stream.',3],[state.drop?'Stream recovered':'Stream ready','With successful delivery and acknowledgement, the receiver can pass the data onward in order.',3]];
case'web':return [['Resolve DNS','Find an IP address for the hostname. This example starts without a cached answer.',0],['Connect with TCP','Establish a TCP connection. This path models a new HTTP/1.1 or HTTP/2 connection, not HTTP/3.',1],['Negotiate TLS','TLS establishes encryption and authenticates the server with its certificate in this simplified flow.',2],['Send HTTP request','Inside TLS, the browser asks for a resource using HTTP.',3],['Receive a response','The server returns a response. Browsers may make many more requests for page resources.',0]];default:return []}}
function nodes(){switch(state.id){case'dns':return [[55,160,'Browser'],[205,160,'Resolver'],[380,58,'Root'],[420,160,'.com TLD'],[380,265,'Authoritative']];case'transport':return [[65,160,'Client'],[220,160,'In transit'],[330,65,'Lost'],[440,160,'Server']];case'web':return [[65,160,'Browser'],[220,60,'TCP'],[340,60,'TLS'],[445,160,'Server']];default:return [[65,160,'Laptop'],[190,100,'Switch'],[330,160,'Router'],[445,100,'Server']]}}
function wires(){return state.id==='dns'?[[0,1],[1,2],[1,3],[1,4]]:state.id==='transport'?[[0,1],[1,2],[1,3]]:[[0,1],[1,2],[2,3]]}
function diagram(){const n=nodes(),step=steps()[state.step]||steps()[0],active=step?.[2]||0;const xy=n[active]||n[0];return `<svg class="diagram" viewBox="0 0 510 320" role="img" aria-label="${e(step?.[0]||'Network diagram')}. Highlighted device: ${e(xy[2])}">${wires().map(([a,b])=>`<line class="wire" x1="${n[a][0]}" y1="${n[a][1]}" x2="${n[b][0]}" y2="${n[b][1]}"/>`).join('')}${n.map(([x,y,label],i)=>`<g><rect class="node ${i===active?'on':''}" x="${x-53}" y="${y-26}" width="106" height="52" rx="22"/><text class="${i===active?'ontext':''}" text-anchor="middle" x="${x}" y="${y+5}">${label}</text></g>`).join('')}<circle class="packet" cx="${xy[0]}" cy="${xy[1]-39}" r="7"/></svg>`}
function layerView(){const names=['Application: HTTP message','Transport: TCP header + data','Internet: IP header + segment','Link: Ethernet frame'];return `<div class="layer-stack">${names.map((n,i)=>`<button class="layer" data-layer="${i}" aria-pressed="${state.layer===i}"><span>${n}</span><span>0${i+1}</span></button>`).join('')}</div><p class="hint">Tap a layer to inspect its role. This example follows HTTP over TCP over IP over Ethernet.</p>`}
function subnetView(){return `<div class="eyebrow" style="margin-top:25px">32 bits. One boundary.</div><div class="bit-grid" aria-label="${state.prefix} network bits and ${32-state.prefix} host bits">${Array.from({length:32},(_,i)=>`<i class="${i<state.prefix?'network':''}"></i>`).join('')}</div><p class="subtle">Purple = network bits · remaining = host bits</p><div id="subnet-results" class="subnet-results"></div>`}
function controls(){if(['layers','subnet'].includes(state.id))return '';return `<div class="controls"><button id="play" class="primary">Play</button><button id="step">Step</button><button id="reset">Reset</button><label class="speed" for="speed">Playback speed <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><p class="hint">Playback illustrates sequence, not measured network timing.</p>`}
function experiments(){switch(state.id){case'dns':return `<div class="row"><button class="cache" data-cache="false" aria-pressed="${!state.cache}">Cache miss</button><button class="cache" data-cache="true" aria-pressed="${state.cache}">Cache hit</button></div><p class="hint">Compare a complete uncached lookup with a valid answer already in the resolver cache.</p>`;case'transport':return `<div class="row"><button class="protocol" data-protocol="TCP" aria-pressed="${state.protocol==='TCP'}">TCP</button><button class="protocol" data-protocol="UDP" aria-pressed="${state.protocol==='UDP'}">UDP</button><button id="drop" aria-pressed="${state.drop}">${state.drop?'One data packet dropped':'No deliberate drop'}</button></div><p class="hint">Loss is a fixed teaching scenario, not a random percentage.</p>`;case'subnet':return `<label for="ip">IPv4 address</label><input id="ip" type="text" inputmode="decimal" value="${e(state.ip)}" autocomplete="off" spellcheck="false" aria-describedby="ip-help"><p id="ip-help" class="hint">Four decimal octets, each 0-255. Example: 192.168.1.42</p><label for="prefix" style="margin-top:18px">Prefix length: <strong id="prefix-label">/${state.prefix}</strong></label><input id="prefix" type="range" min="16" max="30" value="${state.prefix}"><p class="hint">This beginner explorer covers conventional /16 through /30 subnets only.</p>`;case'layers':return '<p class="hint">Select a layer in the stack. The explanation changes with your selection.</p>';default:return '<p class="hint">Use Step to stop at each hop, then inspect a device below.</p>'}}
function lab(l){state.step=0;main.innerHTML=`<div class="lab-head"><div><div class="eyebrow">Lab 0${lessons.indexOf(l)+1} / ${l.tag}</div><h1>${l.title}</h1><p>${l.desc}</p></div><a href="#home" class="pill">← All lessons</a></div><div class="workspace"><section><div class="lab-canvas"><div class="row between"><span class="eyebrow" style="margin:0">${state.id==='subnet'?'Address explorer':state.id==='layers'?'Inside the packet':'Simulation'}</span><span id="stepcount" class="subtle"></span></div><div id="visual">${state.id==='layers'?layerView():state.id==='subnet'?subnetView():diagram()}</div>${controls()}${!['layers','subnet'].includes(state.id)?`<div class="row inspect-controls" aria-label="Inspect network devices">${nodes().map((n,i)=>`<button class="inspect" data-node="${i}">Inspect ${n[2]}</button>`).join('')}</div><div id="inspect" class="inspector" hidden></div>`:''}</div><div class="experiments"><h3>Change something</h3>${experiments()}</div></section><aside class="explain"><div class="eyebrow">What is happening?</div><h2 id="ex-title"></h2><p id="ex-copy"></p><div class="log" ${['layers','subnet'].includes(state.id)?'hidden':''}><div class="eyebrow">Event log</div><ol id="events"></ol></div><div class="warning">Educational model. No packets leave this page, and no real devices are scanned or contacted.</div></aside></div><div class="lesson-body"><section class="card"><div class="eyebrow">The idea</div><h2>Understand the why.</h2><p>${l.learn}</p><div class="source">Read further:<br><a href="${l.source}" target="_blank" rel="noopener noreferrer">${l.sourceName} ↗</a>${l.extra?`<a href="${l.extra}" target="_blank" rel="noopener noreferrer">${l.extraName} ↗</a>`:''}</div></section><section class="quiz"><div class="eyebrow">Check your understanding</div><h3>${l.question}</h3><div class="quiz-options">${l.options.map((o,i)=>`<button data-answer="${i}">${o}</button>`).join('')}</div><p id="feedback" class="feedback" role="status"></p><div id="next-lesson" hidden></div></section></div>`;
wireLab(l);update()}
function wireLab(l){const bind=(s,fn)=>document.querySelectorAll(s).forEach(x=>x.onclick=()=>fn(x));if($('#play')){$('#play').onclick=togglePlay;$('#step').onclick=()=>{stop();advance()};$('#reset').onclick=()=>{stop();state.step=0;update()};$('#speed').value=state.speed;$('#speed').onchange=()=>{state.speed=Number($('#speed').value);if(state.timer){stop();togglePlay()}}}
bind('.cache',x=>{stop();state.cache=x.dataset.cache==='true';lab(l)});bind('.protocol',x=>{stop();state.protocol=x.dataset.protocol;lab(l)});if($('#drop'))$('#drop').onclick=()=>{stop();state.drop=!state.drop;lab(l)};bind('.layer',x=>{state.layer=Number(x.dataset.layer);update()});bind('.inspect',x=>inspect(Number(x.dataset.node)));if($('#ip')){$('#ip').oninput=()=>{state.ip=$('#ip').value;updateSubnet()};$('#prefix').oninput=()=>{state.prefix=Number($('#prefix').value);$('#prefix-label').textContent='/'+state.prefix;$('#visual').innerHTML=subnetView();updateSubnet()}}
bind('[data-answer]',x=>{const ok=Number(x.dataset.answer)===l.answer;$('#feedback').className='feedback'+(ok?' correct':'');$('#feedback').textContent=(ok?'Correct. ':'Not quite. ')+l.why;if(ok){if(!saved.completed.includes(l.id)){saved.completed.push(l.id);persist()}const next=lessons[(lessons.indexOf(l)+1)%lessons.length];$('#next-lesson').hidden=false;$('#next-lesson').innerHTML=`<a class="module-link" href="#${next.id}">Continue: ${next.title} <span>↗</span></a>`}})}
function togglePlay(){if(state.timer){stop();return}const arr=steps();if(state.step>=arr.length-1)state.step=0;update();$('#play').textContent='Pause';state.timer=setInterval(()=>{advance();if(state.step>=steps().length-1)stop()},1300/state.speed)}
function advance(){const arr=steps();state.step=Math.min(state.step+1,arr.length-1);update()}
function update(){const epoch=++animationEpoch;if(state.id==='subnet'){updateSubnet();return}if(state.id==='layers'){const info=[['Application','HTTP creates a request message, such as asking a server for a web page. Other applications use other protocols.'],['Transport','In this example TCP adds ports and stream-control information. UDP is a different transport with different guarantees.'],['Internet','IP adds source and destination addresses so routers can forward packets across networks.'],['Link','Ethernet adds local delivery information, including MAC addresses. Link headers change when moving between links.']][state.layer];$('#ex-title').textContent=info[0];$('#ex-copy').textContent=info[1];document.querySelectorAll('.layer').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.layer)===state.layer)));$('#stepcount').textContent='4-layer teaching model';return}const arr=steps(),s=arr[state.step];const oldPacket=$('#visual .packet'),oldX=oldPacket?.getAttribute('cx'),oldY=oldPacket?.getAttribute('cy');$('#visual').innerHTML=diagram();const newPacket=$('#visual .packet');if(oldX!==undefined&&newPacket&&!saved.motion&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const x=newPacket.getAttribute('cx'),y=newPacket.getAttribute('cy');newPacket.setAttribute('cx',oldX);newPacket.setAttribute('cy',oldY);requestAnimationFrame(()=>requestAnimationFrame(()=>{if(epoch!==animationEpoch)return;newPacket.setAttribute('cx',x);newPacket.setAttribute('cy',y)}))}$('#ex-title').textContent=s[0];$('#ex-copy').textContent=s[1];$('#stepcount').textContent=`Step ${state.step+1} of ${arr.length}`;$('#events').innerHTML=arr.slice(0,state.step+1).map(x=>`<li>${x[0]}</li>`).join('');$('#step').disabled=state.step>=arr.length-1}
function parseIP(v){const parts=v.trim().split('.');if(parts.length!==4||parts.some(p=>!/^\d{1,3}$/.test(p)||Number(p)>255))return null;return parts.reduce((n,p)=>(n*256+Number(p))>>>0,0)}
function ipString(n){return [24,16,8,0].map(s=>(n>>>s)&255).join('.')}
function subnetInfo(v,p){const ip=parseIP(v);if(ip===null||!Number.isInteger(p)||p<16||p>30)return null;const mask=(0xffffffff<<(32-p))>>>0,network=(ip&mask)>>>0,total=2**(32-p),broadcast=(network+total-1)>>>0;return{network:ipString(network),mask:ipString(mask),broadcast:ipString(broadcast),first:ipString(network+1),last:ipString(broadcast-1),total,hosts:total-2}}
function updateSubnet(){const info=subnetInfo(state.ip,state.prefix);$('#stepcount').textContent='/'+state.prefix;$('#ex-title').textContent=info?'A boundary, not a street address.':'Check the IPv4 address';$('#ex-copy').textContent=info?`${state.prefix} bits identify the network, leaving ${32-state.prefix} host bits. That makes ${info.total} total addresses and ${info.hosts} conventional usable host addresses.`:'Enter four decimal numbers between 0 and 255, separated by dots.';$('#subnet-results').innerHTML=info?[['Network',info.network+'/'+state.prefix],['Subnet mask',info.mask],['Broadcast',info.broadcast],['Usable hosts',info.hosts],['First host',info.first],['Last host',info.last]].map(([k,v])=>`<div class="stat"><span>${k}</span><strong>${v}</strong></div>`).join(''):'<p class="warning" role="status">Enter a valid IPv4 address to see the subnet.</p>';$('#ip')?.setAttribute('aria-invalid',String(!info))}
function inspect(i){const label=nodes()[i][2],descriptions={Laptop:'Creates the message and sends it toward its destination.',Browser:'Acts as the client. Real browsers can also have their own DNS caches.',Switch:'Forwards local Ethernet frames using learned MAC addresses.',Router:'Chooses a next hop for an IP packet between networks.',Resolver:'Finds a DNS answer for the client and can cache it.',Root:'Refers the resolver to top-level-domain nameservers. It is not the website server.','.com TLD':'Refers the resolver to the authoritative nameservers for this domain.',Authoritative:'Provides authoritative DNS records for the domain in this simplified lookup.',Client:'Starts this conversation and sends application data.','In transit':'Represents a packet travelling between endpoints, not a physical device.',Lost:'Marks the deliberately dropped sample data packet.',Server:'Receives a connection or datagram and runs an application service.',TCP:'A reliable, ordered byte-stream transport in this example.',TLS:'Protects the application exchange with encryption in this example.'};$('#inspect').hidden=false;$('#inspect').innerHTML=`<h3>${e(label)}</h3><p>${e(descriptions[label]||'A device in this example network.')}</p>`}
function route(focus=true){++animationEpoch;stop();const hash=location.hash.slice(1)||'home';const l=lessons.find(l=>l.id===hash);state.id=l?hash:hash==='progress'?'progress':'home';document.title=(l?l.title:state.id==='progress'?'Your progress':'Learn networking by doing')+' | Packet Playground';if(l)lab(l);else if(state.id==='progress')progress();else home();if(focus){main.focus({preventScroll:true});window.scrollTo(0,0)}}
window.addEventListener('hashchange',()=>route());document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});route(false);
</script></body></html>
